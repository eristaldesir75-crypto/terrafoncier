name: Publier le site
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency: { group: pages-deploy, cancel-in-progress: false }
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - name: Ajout de la copie des PLU (branche data)
        run: |
          if git fetch origin data --depth=1; then git worktree add data origin/data && mkdir -p frontend/data && cp -r data/plu frontend/data/ && (cp -r data/adresses frontend/data/ || true); else echo "Pas encore de copie des PLU"; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: frontend }
      - id: d
        uses: actions/deploy-pages@v4
