name: Tests
on:
  push:
    branches: [main]
    paths: ["frontend/js/**", "frontend/tests/**", "backend/**"]
  workflow_dispatch:
    inputs:
      e2e:
        description: "Test complet sur le site publié (prospection Saran)"
        type: boolean
        default: true
      mobile:
        description: "Test sur téléphone (iPhone émulé)"
        type: boolean
        default: false
      mode:
        description: "Mode : les2, seule, remembrement"
        default: "les2"
      smin:
        description: "Surface minimale (m²)"
        default: "1200"
      maisons:
        description: "Maisons seulement"
        type: boolean
        default: false
      commune:
        description: "Commune (nom et code INSEE)"
        default: "Saran (45302)"
      zones:
        description: "Zones à cocher, séparées par des virgules (vide = choix par défaut)"
        default: ""
      centre:
        description: "Vue de la carte zoom/lat/lon (périmètre « zone affichée »)"
        default: "15/47.9480/1.8700"
permissions: { contents: read }
jobs:
  unitaires:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Tests du site
        working-directory: frontend
        run: |
          npm init -y >/dev/null && npm i @turf/turf@7.1.0 --no-audit --no-fund >/dev/null
          node tests/test_occupation.mjs && node tests/test_regles.mjs && node tests/test_zones.mjs && node tests/test_remembrement.mjs && node tests/test_faisabilite.mjs
  e2e:
    if: github.event_name == 'workflow_dispatch' && inputs.e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Navigateur
        run: npm i playwright@1.48.2 --no-audit --no-fund >/dev/null && npx playwright install --with-deps chromium >/dev/null
      - name: Sur téléphone
        if: inputs.mobile
        run: cp frontend/tests/e2e_mobile.mjs . && node e2e_mobile.mjs
      - name: Prospection sur le site publié
        if: ${{ !inputs.mobile }}
        env:
          MODE: ${{ inputs.mode }}
          SMIN: ${{ inputs.smin }}
          MAISONS: ${{ inputs.maisons && '1' || '' }}
          COMMUNE: ${{ inputs.commune }}
          CENTRE: ${{ inputs.centre }}
          ZONES: ${{ inputs.zones }}
        run: cp frontend/tests/e2e_prospection.mjs . && node e2e_prospection.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: capture, path: "e2e*.png" }
