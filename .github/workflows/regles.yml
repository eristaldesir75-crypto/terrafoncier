name: Lecture des règlements (IA)
on:
  schedule:
    - cron: "3 21 * * *"  # 22 h à Paris : lecture du soir (reste du quota Gemini de la journée, sur tous les modèles)
    - cron: "17 7 * * *"  # 8 h 17 à Paris : on finit avec ce qui reste avant la remise à zéro du quota (9 h)
  workflow_dispatch:
    inputs:
      max_docs:
        description: "Nombre maximal de documents lus ce passage"
        default: "400"
      essai:
        description: "Essai sans Gemini (téléchargement et lecture des PDF seulement)"
        type: boolean
        default: false
permissions:
  contents: write
  pages: write
  id-token: write
concurrency: { group: lecture-reglements, cancel-in-progress: false }
jobs:
  lecture:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    outputs:
      nouveau: ${{ steps.pub.outputs.nouveau }}
    steps:
      - uses: actions/checkout@v4
      - name: Copie des PLU et lectures précédentes
        run: |
          git fetch origin data --depth=1 && git worktree add plu origin/data
          if git fetch origin regles --depth=1; then git worktree add prev origin/regles; else mkdir -p prev; fi
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests pypdf
      - name: Liste des documents de toute la France (une fois par semaine)
        run: |
          if [ -f prev/france.json ] && [ $(( $(date +%s) - $(date -d "$(python3 -c "import json;print(json.load(open('prev/france.json'))['date'])")" +%s) )) -lt 604800 ]; then
            cp prev/france.json france.json; echo "Liste de la semaine reprise"
          else
            python -u tools/docs_france.py --out france.json || cp prev/france.json france.json || true
          fi
      - name: Lecture des règlements par Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ESSAI: ${{ inputs.essai && '1' || '' }}
        run: python -u tools/build_regles.py --plu plu/plu --prev prev --out out --max-docs "${{ inputs.max_docs || '400' }}" --france france.json
      - name: Liste France gardée avec les règles
        run: cp france.json out/france.json 2>/dev/null || true
      - id: pub
        name: Publication sur la branche regles (un seul commit)
        run: |
          if diff -rq prev out -x .git >/dev/null 2>&1; then echo "nouveau=non" >> "$GITHUB_OUTPUT"; echo "Rien de nouveau"; exit 0; fi
          echo "nouveau=oui" >> "$GITHUB_OUTPUT"
          cd out
          git init -q -b regles
          git config user.name "fonciscope-bot"
          git config user.email "fonciscope-bot@users.noreply.github.com"
          git add -A
          git commit -qm "Règles lues le $(date -u +%F)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" regles
  publier:
    needs: lecture
    if: needs.lecture.outputs.nouveau == 'oui'
    uses: ./.github/workflows/pages.yml
