name: Copie des PLU
on:
  schedule:
    - cron: "17 2 * * 0" # chaque dimanche vers 3 h (heure de Paris) : copie des PLU modifiés
  workflow_dispatch:
    inputs:
      max_docs:
        description: "Limiter le nombre de documents copiés (0 = tous, pour un essai)"
        default: "0"
      deps:
        description: "Départements à traiter pour un essai (vide = ceux de data-config.json)"
        default: ""
permissions:
  contents: write
  pages: write
  id-token: write
concurrency: { group: copie-plu, cancel-in-progress: false }
jobs:
  copie:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - name: Copie précédente (branche data)
        run: |
          if git fetch origin data --depth=1; then git worktree add prev origin/data; else mkdir -p prev; fi
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests geopandas pyogrio remotezip
      - name: Copie des PLU
        run: python -u tools/build_plu.py --config data-config.json --prev prev/plu --out out/plu --max-docs "${{ inputs.max_docs || '0' }}" --deps "${{ inputs.deps || '' }}"
      - name: Adresses rattachées aux parcelles (Base Adresse Nationale)
        run: |
          if ! python -u tools/build_adresses.py --config data-config.json --out out/adresses --deps "${{ inputs.deps || '' }}"; then
            echo "Adresses BAN non mises à jour cette semaine, copie précédente gardée"
            rm -rf out/adresses && cp -r prev/adresses out/adresses || true
          fi
      - name: Publication sur la branche data (un seul commit, sans historique)
        run: |
          cd out
          git init -q -b data
          git config user.name "terrafoncier-bot"
          git config user.email "terrafoncier-bot@users.noreply.github.com"
          git add -A
          git commit -qm "Copie des PLU du $(date -u +%F)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
  publier:
    needs: copie
    uses: ./.github/workflows/pages.yml
